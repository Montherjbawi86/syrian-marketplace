test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use Rails.application.config.active_storage.service = :local in development
# Use Rails.application.config.active_storage.service = :amazon in production

amazon:
  service: S3
  access_key_id: <%= ENV['AWS_ACCESS_KEY_ID'] %>
  secret_access_key: <%= ENV['AWS_SECRET_ACCESS_KEY'] %>
  region: <%= ENV['AWS_REGION'] %>
  bucket: <%= ENV['S3_BUCKET_NAME'] %>

# For Heroku, use local storage or S3
production:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>
